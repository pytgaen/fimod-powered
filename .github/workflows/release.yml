name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")

          header = re.compile(
              rf"^##\s+{re.escape(version)}\s+—\s+\d{{4}}-\d{{2}}-\d{{2}}\s*$",
              re.MULTILINE,
          )
          match = header.search(changelog)
          if not match:
              print(f"Could not find CHANGELOG.md section for {version}", file=sys.stderr)
              sys.exit(1)

          start = match.end()
          next_section = re.search(r"^##\s+", changelog[start:], re.MULTILINE)
          end = start + next_section.start() if next_section else len(changelog)
          notes = changelog[start:end].strip()
          if not notes:
              print(f"CHANGELOG.md section for {version} is empty", file=sys.stderr)
              sys.exit(1)

          Path("/tmp/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
